# XcodeGen spec — generate the Xcode project with:  xcodegen generate
# 宣言的スペックをバージョン管理し、.xcodeproj は生成物として扱う（Tameo流用）。
# 既存の Package.swift（swift test / poc）はそのまま生かす。ここでは MaskingCore を
# ローカルパッケージ（path: .）として参照するだけで、SPM 構成には手を入れない。
name: Fuseo

options:
  bundleIdPrefix: jp.co.ati-mirai
  # 開発言語=日本語（UI原文）。enはString Catalogで提供 → ストアの言語欄が「日本語、英語」になる（WP-9）
  developmentLanguage: ja
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "0.2.1"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "8NY87P5TYV"       # ATI K.K.（Developer ID 署名身元）
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES         # notarize 前提

packages:
  # コア本体をローカル参照。Sparkle は Mac 版の自動更新のみ（iOSターゲットには絶対に足さない）。
  MaskingCore:
    path: .
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.9.3"                  # Tameoと同じ（EdDSA署名＋appcast）

targets:
  Fuseo:
    type: application
    platform: macOS
    sources:
      - path: Fuseo
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.co.ati-mirai.fuseo
        PRODUCT_NAME: Fuseo
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Fuseo/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: MaskingCore
        product: MaskingCore
      - package: Sparkle           # 自動更新（appcast: fuseo.ati-mirai.co.jp/appcast.xml）

  # 層1: ロジック/統合テスト（@testable import Fuseo・隔離 UserDefaults・フェイクサービス）。
  FuseoTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: FuseoTests
    dependencies:
      - target: Fuseo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.co.ati-mirai.fuseoTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Fuseo.app/Contents/MacOS/Fuseo"
        BUNDLE_LOADER: "$(TEST_HOST)"

  # 層2: 確認画面/設定のUI駆動テスト（XCUITest。--uitest 系フックで副作用を止める）。
  FuseoUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: FuseoUITests
    dependencies:
      - target: Fuseo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.co.ati-mirai.fuseoUITests
        GENERATE_INFOPLIST_FILE: YES

  # ── WP-8: iOS 版（Services を Mac と共有・Views は iOS 固有） ─────────────
  FuseoiOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Fuseo/Services        # Mac と共有（AppKit 非依存を維持）
      - path: FuseoiOS              # iOS 固有（App・Views・撮影/取込・共有）
        excludes:
          - Info.plist              # 下の info: が生成する（ソースには含めない）
    # WP-11a: 受け取り口。GENERATE_INFOPLIST_FILE と併用し、ビルド設定側の
    # INFOPLIST_KEY_* はこのファイルへマージされる（構造を持つキーだけここに置く）。
    info:
      path: FuseoiOS/Info.plist
      properties:
        # XcodeGen の既定は "1.0"/"1" 固定なので、必ずビルド設定を参照させる
        # （MARKETING_VERSION=1.1 が 1.0 に化けるのを防ぐ）。
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # 「ファイル」/メール添付/他アプリの共有シートに「Fuseoにコピー」を出す。
        # LSHandlerRank=Alternate: 画像/PDFの既定アプリは奪わない（あくまで選択肢の1つ）。
        CFBundleDocumentTypes:
          - CFBundleTypeName: Image
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.image
          - CFBundleTypeName: PDF
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.adobe.pdf
        # NO = 原本を直接開かず**コピーして受け取る**（元ファイルを書き換えない・§3.2）。
        LSSupportsOpeningDocumentsInPlace: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.co.ati-mirai.fuseo.ios
        PRODUCT_NAME: Fuseo
        PRODUCT_MODULE_NAME: FuseoiOS   # Swift モジュール名を固定（@testable import FuseoiOS 用）
        MARKETING_VERSION: "1.2.1"      # v1.2.1=PDF入力・受け取り口・保存と再開(WP-10/11a/13)。1.2(1)は縮小バグ入りでアップロード済みのため欠番。iOSはMac(0.2.x)と独立に採番する
        CURRENT_PROJECT_VERSION: "2"     # 1.2(1) が縮小バグ入りでアップロード済みのため、1.2.1 はビルド 2 から
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "書類を撮影してその場でマスキングするために使用します"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # App Store検証で必須（iPad対応時は4方向 or フルスクリーン指定が必要）
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Fuseo
        # 輸出コンプライアンス: 暗号化非該当（通信コードなし）。ASCのビルド毎の質問をスキップ
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_HARDENED_RUNTIME: NO   # macOS 専用設定。iOS では無効化
    dependencies:
      - package: MaskingCore
        product: MaskingCore

  # 層1(iOS): ロジック/統合テスト（@testable import FuseoiOS・隔離 UserDefaults・フェイクサービス）。
  FuseoiOSTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FuseoiOSTests
    dependencies:
      - target: FuseoiOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.co.ati-mirai.fuseoiOSTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Fuseo.app/Fuseo"
        BUNDLE_LOADER: "$(TEST_HOST)"

  # 層2(iOS): 起動→フィクスチャ自動ロード→Review→手動マスク→書き出しシートのスモーク。
  FuseoiOSUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FuseoiOSUITests
    dependencies:
      - target: FuseoiOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.co.ati-mirai.fuseoiOSUITests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Fuseo:
    build:
      targets:
        Fuseo: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FuseoTests
        - FuseoUITests

  FuseoiOS:
    build:
      targets:
        FuseoiOS: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FuseoiOSTests
        - FuseoiOSUITests
